baseURL: https://georgehao.github.io
title: HHFCodeRv

theme: github.com/adityatelange/hugo-PaperMod

pagination:
  pagerSize: 10
copyright: >
  &copy; 2021 <a href="https://georgehao.github.io/">haohongfan</a>
enableEmoji: true
enableGitInfo: false
summaryLength: 175

defaultContentLanguage: zh
hasCJKLanguage: true # Set `true` for Chinese/Japanese/Korean.
defaultContentLanguageInSubdir: false

# Uncomment for google analytics
# googleAnalytics: UA-123-45

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false
    style: monokai
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

taxonomies:
  category: categories
  tag: tags
  series: series
  author: authors

build:
  useResourceCacheWhen: always
